<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Nitish Mane</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  .notfound { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 1.25rem; padding: 2rem; }
  .notfound h1 { font-family: var(--font-serif); font-size: clamp(3rem, 12vw, 6rem); font-weight: 400; }
  .notfound p { color: var(--text-soft); }
</style>
</head>
<body>
<main class="notfound">
  <h1>404</h1>
  <p>That page does not exist.</p>
  <p><a class="btn" href="/">Back to the portfolio</a></p>
</main>
</body>
</html>
