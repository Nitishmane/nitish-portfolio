<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0e0f12;
    color: #eceef2;
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 88px 90px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  /* Accent rule along the top edge, and a soft glow bottom-right. */
  .rule { position: absolute; inset: 0 0 auto 0; height: 6px; background: #7fd1b9; }
  .glow {
    position: absolute; right: -180px; bottom: -260px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(127,209,185,.16), transparent 68%);
  }
  .domain {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 20px; letter-spacing: .14em; text-transform: uppercase;
    color: #6e747f; margin-bottom: auto;
  }
  /* Same hierarchy as the site hero: the statement leads, the name is its byline. */
  .name {
    font-size: 30px; font-weight: 500; color: #7fd1b9;
    letter-spacing: .01em; margin: 34px 0 16px;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 70px; font-weight: 400; line-height: 1.04;
    letter-spacing: -.02em; max-width: 19ch;
  }
  .tags { display: flex; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
  .tags span {
    border: 1px solid #24272d; border-radius: 999px;
    padding: 8px 18px; font-size: 19px; color: #a2a8b4;
  }
</style>
<div class="rule"></div>
<div class="glow"></div>
<div class="domain">nitishmane.dev</div>
<div class="name">Nitish Mane · Staff Infrastructure Engineer</div>
<h1>I build and run the cloud platforms behind live video, connected vehicles, and data products.</h1>
<div class="tags">
  <span>Kubernetes</span><span>Terraform</span><span>ArgoCD</span><span>AWS</span><span>Observability</span>
</div>
